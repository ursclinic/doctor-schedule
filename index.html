<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>醫師班表</title>
  <style>
    :root {
      --bg: #f4f7f6;
      --text: #17211f;
      --muted: #66736f;
      --line: #d9e2df;
      --card: #ffffff;
      --accent: #197278;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif;
    }

    header {
      padding: 24px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      max-width: 1120px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.2;
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    button {
      appearance: none;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 6px;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(0.95);
    }

    select {
      min-height: 40px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      padding: 0 12px;
      font: inherit;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }

    .weekday {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      padding: 4px 0;
    }

    .day {
      min-height: 132px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }

    .day.empty {
      background: transparent;
      border-color: transparent;
    }

    .day.today {
      background: #fff1e4;
      border-color: #f3b27a;
      box-shadow: inset 0 0 0 1px #ffd2ad;
    }

    .day.today .date {
      color: #9a4e12;
    }

    .date {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .doctor {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.35;
    }

    .doctor-female-full {
      background: #f6b6cb;
      color: #4a2a35;
    }

    .doctor-female-partial {
      background: #feebf1;
      color: #4a2a35;
    }

    .doctor-male-full {
      background: #8cc8e8;
      color: #16394d;
    }

    .doctor-male-partial {
      background: #d7effb;
      color: #1d516a;
    }

    .doctor-name {
      font-weight: 800;
    }

    .doctor-time {
      display: block;
      margin-top: 2px;
    }

    .error {
      color: var(--danger);
      background: #fff;
      border: 1px solid #f3b8b3;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      display: none;
    }

    @media (max-width: 760px) {
      header {
        padding: 18px;
      }

      main {
        padding: 16px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .calendar {
        grid-template-columns: 1fr;
      }

      .weekday,
      .day.empty {
        display: none;
      }

      .day {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1 id="pageTitle">醫師班表</h1>
        <div class="meta" id="sourceLabel">資料來源：Google Sheet</div>
      </div>
      <div>
        <select id="monthSelect" aria-label="選擇月份"></select>
        <button type="button" id="refreshButton">重新整理</button>
      </div>
    </div>
  </header>

  <main>
    <div id="error" class="error"></div>
    <div class="toolbar">
      <div class="status" id="status">尚未載入</div>
      <div class="status">每 10 秒自動更新</div>
    </div>
    <section class="calendar" id="calendar" aria-label="醫師班表月曆"></section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycby95ijwscdTkEVB8XhP_xuy2sVJt7OWt9tySfh0coMrJ5kI1IW5j1FXydN7vVpmBqmI/exec";

    const doctorNames = {
      A: "A醫師",
      B: "B醫師",
      C: "C醫師",
      D: "D醫師",
      E: "E醫師",
      F: "F醫師",
      G: "G醫師",
      H: "H醫師",
      J: "J醫師",
      P: "P醫師"
    };

    const doctorGenderMap = {
      "謝旻益院長": "男",
      "謝旻益": "男",
      "江鎮佑醫師": "男",
      "江鎮佑": "男",
      "陳淳醫師": "男",
      "陳淳": "男",
      "楊醫師": "男",
      "楊": "男",
      "黃醫師": "男",
      "黃": "男",
      "詹喬雅醫師": "女",
      "詹喬雅": "女",
      "何佳潔醫師": "女",
      "何佳潔": "女",
      "張佳螢醫師": "女",
      "張佳螢": "女",
      "陳醫師": "女",
      "陳宜君醫師": "女",
      "陳宜君": "女",
      "陳若瑄醫師": "女",
      "陳若瑄": "女",
      "郭醫師": "女",
      "郭": "女",
      "潘醫師": "女",
      "潘": "女"
    };

    const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
    const calendar = document.getElementById("calendar");
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");
    const refreshButton = document.getElementById("refreshButton");
    const monthSelect = document.getElementById("monthSelect");
    const pageTitle = document.getElementById("pageTitle");
    const sourceLabel = document.getElementById("sourceLabel");

    let monthSettings = {};

    function normalizeDoctorKey(value) {
      return String(value || "").replace(/\s/g, "");
    }

    function getDoctorGender(doctor) {
      if (doctor.gender) return doctor.gender;

      const candidates = [
        doctor.name,
        doctor.sourceName,
        doctorNames[doctor.code],
        doctor.code
      ];

      for (const candidate of candidates) {
        const exact = doctorGenderMap[candidate];
        if (exact) return exact;

        const normalized = normalizeDoctorKey(candidate);
        if (doctorGenderMap[normalized]) return doctorGenderMap[normalized];
      }

      return "";
    }

    function getDoctorColorClass(doctor) {
      const gender = getDoctorGender(doctor);
      const isFullDay = doctor.fullDay ?? (doctor.start === "12:30" && doctor.end === "20:30");

      if (gender === "女") {
        return isFullDay ? "doctor-female-full" : "doctor-female-partial";
      }

      if (gender === "男") {
        return isFullDay ? "doctor-male-full" : "doctor-male-partial";
      }

      return "";
    }

    function formatDoctor(doctor) {
      const name = doctor.name || doctorNames[doctor.code] || doctor.code;
      const isFullDay = doctor.fullDay ?? (doctor.start === "12:30" && doctor.end === "20:30");
      const time = isFullDay ? "全天 12:30-20:30" : `${doctor.start}-${doctor.end}`;
      const colorClass = getDoctorColorClass(doctor);

      return `
        <span class="doctor ${colorClass}">
          <span class="doctor-name">${name}</span>
          <span class="doctor-time">${time}</span>
        </span>
      `;
    }

    function buildApiUrl(sheetName) {
      return `${API_URL}?sheet=${encodeURIComponent(sheetName)}`;
    }

    function buildConfigUrl() {
      return `${API_URL}?mode=config`;
    }

    function renderMonthOptions(configList) {
      monthSelect.innerHTML = configList.map(function(config) {
        const label = config.title.replace(" 醫師班表", "");
        return `<option value="${config.sheetName}">${label}</option>`;
      }).join("");
    }

    function buildMonthSettingsMap(configList) {
      const map = {};

      configList.forEach(function(config) {
        map[config.sheetName] = {
          title: config.title,
          source: config.source,
          month: Number(config.month),
          firstDayWeekday: Number(config.firstDayWeekday),
          daysInMonth: Number(config.daysInMonth)
        };
      });

      return map;
    }

    function pickCurrentMonth(configList) {
      const now = new Date();
      const sheetName = String(now.getFullYear()).slice(2) + String(now.getMonth() + 1).padStart(2, "0");

      if (monthSettings[sheetName]) {
        monthSelect.value = sheetName;
        return;
      }

      if (configList.length) {
        monthSelect.value = configList[configList.length - 1].sheetName;
      }
    }

    function renderSchedule(rows, settings) {
      const byDay = new Map(rows.map(function(row) {
        return [Number(row.day), row];
      }));
      const cells = [];
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth() + 1;
      const currentDay = now.getDate();

      weekdays.forEach(function(day) {
        cells.push(`<div class="weekday">${day}</div>`);
      });

      for (let i = 0; i < settings.firstDayWeekday; i++) {
        cells.push('<div class="day empty"></div>');
      }

      for (let day = 1; day <= settings.daysInMonth; day++) {
        const row = byDay.get(day);
        const weekday = row ? row.weekday : weekdays[(settings.firstDayWeekday + day - 1) % 7];
        const doctors = row && row.doctors.length
          ? row.doctors.map(formatDoctor).join("")
          : '<span class="meta">未排診</span>';

        const isToday =
          currentYear === 2000 + Number(settings.source.slice(0, 2)) &&
          currentMonth === settings.month &&
          currentDay === day;

        cells.push(`
          <article class="day ${isToday ? "today" : ""}">
            <div class="date">
              <span>${settings.month}/${day}</span>
              <span class="meta">${weekday}</span>
            </div>
            ${doctors}
          </article>
        `);
      }

      calendar.innerHTML = cells.join("");
    }

    async function loadMonthConfigs() {
      const response = await fetch(buildConfigUrl());

      if (!response.ok) {
        throw new Error(`月份設定讀取失敗：${response.status}`);
      }

      const configList = await response.json();

      if (!Array.isArray(configList) || !configList.length) {
        throw new Error("沒有可用的月份設定");
      }

      monthSettings = buildMonthSettingsMap(configList);
      renderMonthOptions(configList);
      pickCurrentMonth(configList);
    }

    async function loadSchedule() {
      try {
        errorBox.style.display = "none";
        status.textContent = "讀取中...";

        const sheetName = monthSelect.value;
        const settings = monthSettings[sheetName];

        if (!settings) {
          throw new Error("找不到對應的月份設定");
        }

        pageTitle.textContent = settings.title;
        sourceLabel.textContent = `資料來源：Google Sheet「${settings.source}」`;

        const response = await fetch(buildApiUrl(sheetName));

        if (!response.ok) {
          throw new Error(`API 回應失敗：${response.status}`);
        }

        const rows = await response.json();

        if (!Array.isArray(rows)) {
          throw new Error(rows.error || "API 回傳格式錯誤");
        }

        renderSchedule(rows, settings);
        status.textContent = `最後更新：${new Date().toLocaleString("zh-TW")}`;
      } catch (error) {
        errorBox.style.display = "block";
        errorBox.textContent = `讀取失敗：${error.message}`;
        status.textContent = "更新失敗";
      }
    }

    async function initializePage() {
      try {
        await loadMonthConfigs();
        await loadSchedule();
      } catch (error) {
        errorBox.style.display = "block";
        errorBox.textContent = `初始化失敗：${error.message}`;
        status.textContent = "更新失敗";
      }
    }

    refreshButton.addEventListener("click", loadSchedule);
    monthSelect.addEventListener("change", loadSchedule);
    initializePage();
    setInterval(loadSchedule, 10000);
  </script>
</body>
</html>
